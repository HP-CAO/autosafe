GymParams:
  RobotParams:
    x_threshold: 0.35
    theta_dot_threshold: 15.0
    gravity: 9.8
    mass_cart: 0.94
    mass_pole: 0.23
    action_mag: 10.0
    length: 0.64
    friction_cart: 10.0
    friction_pole: 0.0011
    with_friction: true
  TaskParams:
    action_penalty: 0.01
    crash_penalty: 0.0
    ini_states:
    - 0.0
    - 0.0
    - 3.141592653589793
    - 0.0
    control_goal:
    - 0.0
    - 0.0
    max_episode_steps: 500
    evaluation_period: 10000
    num_episodes_to_run: 10
    task_reset_mode: random
    change_dynamics: true
    context_horizon: 10
  SimulationParams:
    random_reset_train: true
    random_reset_eval: false
    num_action_repeat: 20
    sim_time_step: 0.001
    enable_rendering: false
    kinematics_integrator: euler
    render_mode: human
AgentParams:
  agent_name: SAC
  mode: train
  soft_alpha: 0.005
  learning_rate_actor: 0.0003
  learning_rate_critic: 0.0003
  batch_size: 256
  target_network_frequency: 1
  noise_clip: 0.5
  entropy_alpha: 0.1
  gamma_discount: 0.99
  model_path: ''
  total_training_steps: 500000
  replay_buffer_size: 500000
  learning_starts: 3000
  policy_update_frequency: 1
  use_layer_norm: false
  actor_hidden_units:
  - 256
  - 256
  critic_hidden_units:
  - 256
  - 256
  actor_activation: relu
  critic_activation: relu
ContextParams:
  batch_size: 256
  model_name: IB_model
  model_path: ''
  input_dim: 70
  embedding_dim: 2
  output_dim: 4
  num_contexts: 4
  encoder_type: stochastic
  encoder_hidden_units:
  - 256
  - 256
  - 64
  encoder_activation: gelu
  encoder_layer_norm: true
  encoder_learning_rate: 0.0003
  encoder_target: false
  soft_update_tau: 0.005
  info_max_type: explicit
  infoNCE_temperature: 0.2
  infoNCE_normalization: true
  infoNCE_num_negatives: 3
  infoNCE_sim_type: critic
  critic_learning_rate: 0.0005
  decoder_hidden_units:
  - 32
  decoder_activation: linear
  decoder_layer_norm: false
  decoder_learning_rate: 0.0005
  decoder_loss_type: cross_entropy
  beta: 0.3
  beta_bnds:
  - 1.0e-05
  - 0.1
  beta_schedule: constant
  prior: isotropic_gaussian
  ema_decay: 0.99
JobParams:
  gpu: false
  job_name: ''
  run_mode: train
  seed: 1
  capture_video: false
  output_path: ''
