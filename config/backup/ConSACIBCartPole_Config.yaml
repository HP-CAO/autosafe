GymParams:
  RobotParams:
    x_threshold: 0.35
    theta_dot_threshold: 15.0
    gravity: 9.8
    mass_cart: 0.94
    mass_pole: 0.23
    action_mag: 10.0
    length: 0.64
    friction_cart: 10.0
    friction_pole: 0.0011
    with_friction: true
  TaskParams:
    action_penalty: 0.01
    crash_penalty: 0.0
    ini_states:
    - 0.0
    - 0.0
    - 3.141592653589793
    - 0.0
    control_goal:
    - 0.0
    - 0.0
    max_episode_steps: 500
    evaluation_period: 20000
    num_episodes_to_run: 10
    task_reset_mode: random
    change_dynamics: true
    context_horizon: 20
  SimulationParams:
    random_reset_train: true
    random_reset_eval: false
    num_action_repeat: 20
    sim_time_step: 0.001
    enable_rendering: false
    kinematics_integrator: euler
    render_mode: human
AgentParams:
  agent_name: SAC
  mode: train
  soft_alpha: 0.01
  learning_rate_actor: 0.0003
  learning_rate_critic: 0.0005
  batch_size: 254
  target_network_frequency: 1
  noise_clip: 0.5
  entropy_alpha: 0.01
  gamma_discount: 0.99
  model_path: ''
  total_training_steps: 1000000
  replay_buffer_size: 1000000
  learning_starts: 10000
  policy_update_frequency: 1
  use_layer_norm: true
JobParams:
  gpu: true
  job_name: ''
  run_mode: train
  seed: 1
  capture_video: false
  output_path: ''
ContextIBParams:
  epochs: 5000
  batch_size: 254
  replay_buffer_size: 1000000
  learning_rate: 0.001
  model_name: PhyIB_model
  context_dim: 3
  embedding_dim: 5
  context_reparameterize: false
  context_sensitivity: 0.1
  use_layer_norm: true
  beta: 0.0007
  accepctance_threshold: 0.1
  infoNCE_mode: paired
  prior: Isotropic_Gaussian
  loss_function: IB_loss
  loss_reduction: sum
  num_samples: 15
  num_negatives: 30
  model_path: ''
  pretrain: true
  training_period: 2000
