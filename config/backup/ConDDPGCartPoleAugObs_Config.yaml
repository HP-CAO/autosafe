GymParams:
  RobotParams:
    x_threshold: 0.35
    theta_dot_threshold: 15.0
    gravity: 9.8
    mass_cart: 0.94
    mass_pole: 0.23
    action_mag: 5.0
    length: 0.64
    friction_cart: 10.0
    friction_pole: 0.0011
    with_friction: true
  TaskParams:
    action_penalty: 0.01
    crash_penalty: 0.0
    ini_states:
    - 0.0
    - 0.0
    - 3.141592653589793
    - 0.0
    control_goal:
    - 0.0
    - 0.0
    max_episode_steps: 500
    evaluation_period: 10000
    num_episodes_to_run: 10
    task_reset_mode: random
    change_dynamics: true
    context_horizon: 10
  SimulationParams:
    random_reset_train: true
    random_reset_eval: false
    num_action_repeat: 20
    sim_time_step: 0.001
    enable_rendering: false
    kinematics_integrator: euler
    render_mode: human
AgentParams:
  agent_name: DDPG
  mode: train
  action_noise: OU
  action_noise_factor: 1.0
  action_noise_half_decay_time: 1000000.0
  soft_alpha: 0.005
  learning_rate_actor: 0.0003
  learning_rate_critic: 0.0003
  batch_size: 512
  gamma_discount: 0.99
  model_path: ''
  total_training_steps: 1000000
  replay_buffer_size: 1000000
  learning_starts: 5000
JobParams:
  gpu: true
  job_name: 'ConDDPGCartPoleAugObs'
  run_mode: train
  seed: 1
  capture_video: false
  output_path: ''
