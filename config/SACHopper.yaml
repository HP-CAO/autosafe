GymParams:
  RobotParams:
    xml_file: hopper.xml
  TaskParams:
    max_episode_steps: 500
    evaluation_period: 10000
    num_episodes_to_run: 1
    forward_reward_weight: 1.0
    ctrl_cost_weight: 0.001
    reset_noise_scale: 0.005
    contact_cost_weight: 0.0005
    terminate_when_unhealthy: true
    exclude_current_positions_from_observation: true
    healthy_reward: 1.0
    healthy_state_range:
    - -100.0
    - 100.0
    healthy_z_range:
    - 0.7
    - .inf
    healthy_angle_range:
    - -0.2
    - 0.2
    contact_force_range:
    - -1.0
    - 1.0
    include_cfrc_ext_in_observation: true
    ini_states: null
    change_dynamics: false
    context_horizon: 10
  SimulationParams:
    num_simulation_steps: 1
    num_simulation_steps_per_iteration: 1
    num_iterations: 1000
    num_episodes_per_iteration: 1
    enable_rendering: False
    main_body: 1
    frame_skip: 4
    default_camera_config:
      trackbodyid: 2
      distance: 3.0
      lookat:
      - 0.0
      - 0.0
      - 1.15
      elevation: -20.0
AgentParams:
  agent_name: SAC
  mode: train
  soft_alpha: 0.005
  learning_rate_actor: 0.0003
  learning_rate_critic: 0.0003
  batch_size: 512
  target_network_frequency: 1
  noise_clip: 0.5
  entropy_alpha: 0.02
  gamma_discount: 0.99
  model_path: ''
  total_training_steps: 1000000
  replay_buffer_size: 1000000
  learning_starts: 5000
  policy_update_frequency: 1
  use_layer_norm: true
JobParams:
  gpu: true
  job_name: ''
  run_mode: train
  seed: 1
  capture_video: false
  output_path: ''
